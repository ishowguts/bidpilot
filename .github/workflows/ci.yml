name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bidpilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5433/bidpilot
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/bidpilot_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE bidpilot_test;"

      - run: pnpm install --frozen-lockfile

      - name: Migrate and Seed
        run: |
          pnpm --filter db migrate
          DATABASE_URL=$DATABASE_URL_TEST pnpm --filter db migrate
          DATABASE_URL=$DATABASE_URL_TEST pnpm --filter db seed

      - name: Guard
        run: node scripts/guard.mjs all

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
